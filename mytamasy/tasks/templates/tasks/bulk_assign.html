<!DOCTYPE html>
<html lang="it">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>TaMaSy - Assegnazione Massiva</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="w-auto ms-3"><a class="navbar-brand" href="{% url 'index' %}">TaMaSy Web Dashboard</a></div>
        <div class="w-auto text-light col-md-auto me-4">{{ user.get_username }} <a href="{% url 'logout' %}">logout</a></div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        Assegnazione Massiva Task Aperti
                    </div>
                    <div class="card-body">
                        <p class="text-muted">
                            Assegna tutti i <strong>{{ open_count }} task aperti</strong>
                            a un utente.
                        </p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="user_id" class="form-label">Assegna a:</label>
                                <select name="user_id" id="user_id" class="form-select" required>
                                    <option value="">-- Scegli un utente --</option>
                                    {% for u in users %}
                                    <option value="{{ u.id }}">{{ u.username }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                Assegna {{ open_count }} task
                            </button>
                            <a href="{% url 'index' %}" class="btn btn-outline-secondary ms-2">Annulla</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
